<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LexFlow — Apprends des mots sans avoir l'impression d'étudier</title>
  <meta name="theme-color" content="#F5F5F7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ SVG SPRITE (icons + gradients) ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071E3"/><stop offset="100%" stop-color="#0077ED"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,113,227,.18)"/><stop offset="100%" stop-color="rgba(0,113,227,0)"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071E3"/><stop offset="100%" stop-color="#0077ED"/>
    </linearGradient>

    <!-- Lucide-style stroke icons (24px, 1.8 stroke) -->
    <g id="i-home"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></g>
    <g id="i-compass"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></g>
    <g id="i-grad"><path d="M12 4 2 9l10 5 8-4v6"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/></g>
    <g id="i-book"><path d="M4 4.5A2 2 0 0 1 6 3h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 3v18"/></g>
    <g id="i-cards"><rect x="3" y="6" width="13" height="14" rx="2"/><path d="M8 6V4.5A1.5 1.5 0 0 1 9.5 3H20a1 1 0 0 1 1 1v11a1.5 1.5 0 0 1-1.5 1.5H16"/></g>
    <g id="i-chart"><path d="M3 3v18h18"/><path d="m7 14 3-4 3 3 4-6"/></g>
    <g id="i-user"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>
    <g id="i-cog"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></g>
    <g id="i-palette"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="9.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="13.5" r="1.3" fill="currentColor" stroke="none"/></g>
    <g id="i-play"><path d="M7 5v14l12-7z" fill="currentColor" stroke="none"/></g>
    <g id="i-volume"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></g>
    <g id="i-mic"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g>
    <g id="i-bookmark"><path d="M6 3h12v18l-6-4-6 4z"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></g>
    <g id="i-flame"><path d="M12 3c1 3-1 4-1 6a3 3 0 0 0 6 0c0-1-.5-2-1-2.5C17 9 18 11 18 14a6 6 0 1 1-12 0c0-4 3-6 4-8 .8 1.5 0 3 2-3z"/></g>
    <g id="i-check"><path d="m5 13 4 4L19 7"/></g>
    <g id="i-x"><path d="M6 6 18 18M18 6 6 18"/></g>
    <g id="i-arrow-right"><path d="M5 12h14M13 6l6 6-6 6"/></g>
    <g id="i-arrow-left"><path d="M19 12H5M11 18l-6-6 6-6"/></g>
    <g id="i-clock"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
    <g id="i-target"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></g>
    <g id="i-zap"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g>
    <g id="i-sparkle"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/></g>
    <g id="i-share"><circle cx="6" cy="12" r="2.5"/><circle cx="17" cy="6" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="m8.5 11 6-4M8.5 13l6 4"/></g>
    <g id="i-globe"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></g>
    <g id="i-bell"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6M10 20a2 2 0 0 0 4 0"/></g>
    <g id="i-moon"><path d="M20 14a8 8 0 1 1-10-10 6 6 0 0 0 10 10z"/></g>
    <g id="i-inbox"><path d="M3 13h5l2 3h4l2-3h5M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></g>
    <g id="i-alert"><path d="M12 3 2 20h20z"/><path d="M12 9v5M12 17h.01"/></g>
    <g id="i-trophy"><path d="M7 4h10v4a5 5 0 0 1-10 0zM5 4H3v2a3 3 0 0 0 3 3M19 4h2v2a3 3 0 0 1-3 3M9 17h6M10 21h4M12 13v4"/></g>
  </defs>
</svg>

<!-- ============ LANDING (aura.build style) ============ -->
<section id="splash" class="fullscreen landing is-open" aria-label="Accueil LexFlow">
  <div class="aurora" aria-hidden="true">
    <span class="aurora__blob a1"></span>
    <span class="aurora__blob a2"></span>
    <span class="aurora__blob a3"></span>
    <div class="aurora__grid"></div>
  </div>

  <div class="landing__inner" id="landingParallax">
    <div class="brand brand--center" data-pf="6">
      <svg class="brand__mark" width="40" height="40" viewBox="0 0 48 48" fill="none">
        <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#logoGrad)"/>
        <path d="M16 14v20M16 14h10M16 23h8M16 34l11-7" stroke="#04140F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand__name">LexFlow</span>
    </div>

    <span class="pill" data-pf="10">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-sparkle"/></svg>
      Vocabulaire premium, sans effort
    </span>

    <h1 class="landing__title" data-pf="16">
      Apprends des mots <span class="grad-text">sans avoir l'impression d'étudier.</span>
    </h1>

    <p class="landing__sub" data-pf="22">
      Un feed audio-first, immersif. Écoute, ressens, retiens — comme un réseau social,
      mais pour ton vocabulaire.
    </p>

    <div class="landing__cta" data-pf="28">
      <button class="btn btn--primary btn--lg" onclick="startOnboarding()">
        Commencer gratuitement
        <svg width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><use href="#i-arrow-right"/></svg>
      </button>
      <button class="btn btn--glass btn--lg" onclick="skipToApp()">J'ai déjà un compte</button>
    </div>

    <div class="landing__stats" data-pf="34">
      <div><strong>12 000+</strong><span>mots</span></div>
      <div><strong>4.9★</strong><span>note moyenne</span></div>
      <div><strong>100%</strong><span>audio-first</span></div>
    </div>
  </div>
</section>

<!-- ============ ONBOARDING ============ -->
<section id="onboarding" class="fullscreen" aria-label="Personnalisation">
  <div class="onb">
    <div class="col gap-3">
      <div class="row between caption">
        <span id="onbStep">Étape 1 / 3</span>
        <button class="btn--ghost caption" onclick="skipToApp()" style="padding:4px 8px;border-radius:8px">Passer</button>
      </div>
      <div class="progress progress--thin"><span id="onbBar" style="width:33%"></span></div>
    </div>
    <div id="onbBody"><!-- injected --></div>
    <button id="onbNext" class="btn btn--primary btn--lg btn--block" onclick="onbAdvance()" disabled>Continuer</button>
  </div>
</section>

<!-- ============ APP SHELL ============ -->
<div id="app" class="app hidden">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand__mark" width="36" height="36" viewBox="0 0 48 48" fill="none">
        <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#logoGrad)"/>
        <path d="M16 14v20M16 14h10M16 23h8M16 34l11-7" stroke="#04140F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand__name">LexFlow</span>
    </div>
    <nav class="col gap-1" id="sideNav"></nav>
    <div class="sidebar__foot col gap-1">
      <a class="nav-item" href="design-system.html"><svg width="22" height="22" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><use href="#i-palette"/></svg><span>Design System</span></a>
      <button class="nav-item" data-view="settings"><svg width="22" height="22" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><use href="#i-cog"/></svg><span class="lbl">Paramètres</span></button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="main"><!-- views injected --></main>
</div>

<!-- Bottom nav (mobile) -->
<nav class="bottom-nav" id="bottomNav" aria-label="Navigation"></nav>

<!-- ============ MODAL ============ -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modalBox"></div>
</div>

<!-- ============ TOASTS ============ -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
